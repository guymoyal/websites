name = "aibuzzworld"
main = "src/worker.ts"
compatibility_date = "2025-08-11"

# Optional: if you prefer SPA-like routing, uncomment the next line
# and ensure your app can handle client-side routes.
# not_found_handling = "single-page-application"

[assets]
directory = "./out"
binding = "ASSETS"
# /go/* must reach the worker (302 to the tracking link) even though static
# fallback pages exist for those paths in ./out.
run_worker_first = ["/go/*"]

# Tip: Set your account ID via `wrangler login` or add below if using API token based CI.
# account_id = "<your-account-id>"

# ads.txt is served as a static file from public/ads.txt (Google AdSense
# authorized sellers line). No redirect needed.

# Route your custom domain(s) to this Worker
[[routes]]
pattern = "aibuzz.world/*"
zone_name = "aibuzz.world"

[[routes]]
pattern = "www.aibuzz.world/*"
zone_name = "aibuzz.world"

